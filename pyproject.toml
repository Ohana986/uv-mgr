[project]
name = "uv-mgr"
version = "0.1.0"
description = "uv 包装器：全局索引管理 + 孤立包垃圾回收"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["uv", "package-management", "cache", "gc", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving :: Packaging",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/xr-w/uv-mgr"
Repository = "https://github.com/xr-w/uv-mgr"

[project.scripts]
uv-mgr = "uv_mgr.cli:main"

[dependency-groups]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["uv_mgr*"]

[tool.uv]
package = true

authors = [{ name = "XR_W", email = "2662539512@QQ.com" }]
