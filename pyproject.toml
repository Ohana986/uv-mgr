[project]
name = "uv-mgr"
dynamic = ["version"]
description = "uv 包装器：全局索引管理 + 孤立包垃圾回收"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "xr_w", email = "2662539512@qq.com" }]
keywords = ["uv", "package-management", "cache", "gc", "python"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Archiving :: Packaging",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/xr-w/uv-mgr"
Repository = "https://github.com/xr-w/uv-mgr"

[project.scripts]
uv-mgr = "uv_mgr.cli:main"

[dependency-groups]
dev = [
    "build>=1.2",
    "pytest>=9.1.1",
    "twine>=5.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "uv_mgr.__version__"}

[tool.setuptools.packages.find]
include = ["uv_mgr*"]

[tool.uv]
package = true
constraint-dependencies = [
    "packaging==26.3",
]
